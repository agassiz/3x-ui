services:
  3xui:
    build:
      context: .
      dockerfile: ./Dockerfile.dev
    image: 3x-ui:dev  # 明确指定镜像名称，与docker-build-fast.sh保持一致
    container_name: 3xui_app_dev
    # hostname: yourhostname <- optional
    # fail2ban 的 IP 限制靠 iptables 封禁，需要 NET_ADMIN（NET_RAW 覆盖 ip6tables）
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - $PWD/db/:/etc/x-ui/
      - $PWD/cert/:/root/cert/
    environment:
      XRAY_VMESS_AEAD_FORCED: "false"
      XUI_ENABLE_FAIL2BAN: "true"
    tty: true
    # 使用特定端口而不是host模式，方便开发调试
    ports:
      - "54321:2053"  # 面板端口
      - "2096:2096"   # 默认订阅端口；如数据库中的订阅端口不同，请同步调整
      - "443:443"      # HTTPS端口
    restart: unless-stopped
